<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Draw</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #87CEEB;
}

h2 { margin-top: 10px; }

canvas {
    border: 2px solid black;
}

#drawCanvas {
    background: white;
    cursor: crosshair;
}

#gameCanvas {
    display: none;
    background: skyblue;
}

.controls {
    margin-top: 10px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    font-size: 14px;
    cursor: pointer;
}

#score {
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="drawScreen">
    <h2>Dibuja tu personaje</h2>
    <canvas id="drawCanvas" width="150" height="150"></canvas>
    <div class="controls">
        <button id="clearBtn">Limpiar</button>
        <button id="saveBtn">Guardar & Jugar</button>
    </div>
</div>

<div id="gameUI">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="score"></div>
    <button id="restartBtn" style="display:none;">Jugar de nuevo</button>
</div>

<script>
// ===================== DRAW SYSTEM =====================
const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");

let drawing = false;

function getPos(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function startDraw(e) { drawing = true; }
function endDraw() { drawing = false; }

function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(drawCanvas, e);
    drawCtx.fillStyle = "black";
    drawCtx.beginPath();
    drawCtx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
    drawCtx.fill();
}

drawCanvas.addEventListener("mousedown", startDraw);
drawCanvas.addEventListener("mouseup", endDraw);
drawCanvas.addEventListener("mouseleave", endDraw);
drawCanvas.addEventListener("mousemove", draw);

drawCanvas.addEventListener("touchstart", startDraw);
drawCanvas.addEventListener("touchend", endDraw);
drawCanvas.addEventListener("touchmove", draw);

document.getElementById("clearBtn").onclick = () => {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
};

// ===================== GAME SYSTEM =====================
const gameCanvas = document.getElementById("gameCanvas");
const ctx = gameCanvas.getContext("2d");

let playerImage = new Image();
let animationId;
let gameRunning = false;

let player, pipes, frame, score;

function initGame() {
    player = {
        x: 80,
        y: 200,
        width: 40,
        height: 40,
        velocity: 0,
        gravity: 0.5,
        jump: -8
    };

    pipes = [];
    frame = 0;
    score = 0;
    gameRunning = true;
    document.getElementById("score").innerText = "Puntuación: 0";
    document.getElementById("restartBtn").style.display = "none";
}

function createPipe() {
    let gap = 150;
    let topHeight = Math.random() * 250 + 50;

    pipes.push({
        x: gameCanvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
    });
}

function update() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
    frame++;

    // Player physics
    player.velocity += player.gravity;
    player.y += player.velocity;

    ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);

    if (frame % 100 === 0) createPipe();

    for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];
        p.x -= 2;

        ctx.fillStyle = "green";
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillRect(p.x, p.bottom, 50, gameCanvas.height);

        // Collision
        if (
            player.x < p.x + 50 &&
            player.x + player.width > p.x &&
            (player.y < p.top || player.y + player.height > p.bottom)
        ) {
            gameOver();
        }

        // Score
        if (!p.passed && p.x + 50 < player.x) {
            p.passed = true;
            score++;
            document.getElementById("score").innerText = "Score: " + score;
        }
    }

    // Ground / ceiling
    if (player.y + player.height > gameCanvas.height || player.y < 0) {
        gameOver();
    }

    animationId = requestAnimationFrame(update);
}

function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    document.getElementById("restartBtn").style.display = "inline-block";
}

// Jump
function jump() {
    if (gameRunning) player.velocity = player.jump;
}

document.addEventListener("keydown", jump);
gameCanvas.addEventListener("click", jump);
gameCanvas.addEventListener("touchstart", jump);

// Restart
document.getElementById("restartBtn").onclick = () => {
    initGame();
    update();
};

// ===================== SAVE & START =====================
document.getElementById("saveBtn").onclick = () => {
    const dataURL = drawCanvas.toDataURL();
    playerImage.src = dataURL;

    playerImage.onload = () => {
        document.getElementById("drawScreen").style.display = "none";
        gameCanvas.style.display = "block";
        initGame();
        update();
    };
};
</script>
</body>
</html>

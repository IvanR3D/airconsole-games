<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- AirConsole: viewport optimizado para TV (960x540 base) con escalado responsive -->
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Laboratorio Químico - STEAM RD</title>
    <!-- Preconnect para recursos externos -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fuente legible para TV (reglas: fuentes grandes, alto contraste) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- AirConsole: Prevenir selección de texto y comportamientos táctiles no deseados -->
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.airconsole.com/api/airconsole-1.8.0.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: {
                            turquesa: '#0d9488',
                            morado: '#7c3aed',
                            naranja: '#f59e0b',
                            verde: '#22c55e',
                            negro: '#1a1a1a',
                            blanco: '#FFFFFF'
                        },
                        lab: {
                            primary: '#14b8a6',
                            secondary: '#7c3aed',
                            accent: '#22c55e',
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="screen-styles.css">
    <link rel="stylesheet" href="lab-animation.css">
</head>
<body class="screen-shell overflow-hidden">
    <!-- Solo la imagen del laboratorio como fondo -->
    <div class="global-bg" aria-hidden="true"></div>

    <main class="screen-main" id="app" role="main"></main>
    
    <!-- Raphael.js para animaciones vectoriales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="lab-animation.js"></script>
    
    <!-- Cargar anime.js y luego screen-app.js -->
    <script type="module">
        import { animate, stagger, createSpring } from 'https://esm.sh/animejs';
        window.anime = { animate, stagger, createSpring };
        
        // Cargar screen-app.js después de que anime.js esté listo
        const script = document.createElement('script');
        script.src = 'screen-app.js';
        document.body.appendChild(script);
    </script>
</body>
</html>

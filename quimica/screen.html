<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- AirConsole: viewport optimizado para TV (960x540 base) con escalado responsive -->
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Laboratorio Químico - STEAM RD</title>
    <!-- AirConsole: Prevenir selección de texto y comportamientos táctiles no deseados -->
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.airconsole.com/api/airconsole-1.8.0.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: {
                            turquesa: '#0595AE',
                            morado: '#AB3D8B',
                            naranja: '#EB8225',
                            verde: '#73A03F',
                            negro: '#010101',
                            blanco: '#FFFFFF'
                        },
                        lab: {
                            primary: '#6366f1',
                            secondary: '#8b5cf6',
                            accent: '#06b6d4',
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="screen-styles.css">
    <link rel="stylesheet" href="lab-animation.css">
</head>
<body class="font-sans overflow-hidden">
    <!-- Fondo global con olas -->
    <div class="global-bg">
        <div class="global-blob-1"></div>
        <div class="global-blob-2"></div>
        <div class="global-waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
    
    <div class="w-screen h-screen flex flex-col relative" id="app"></div>
    
    <!-- Raphael.js para animaciones vectoriales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="lab-animation.js"></script>
    
    <!-- Cargar anime.js y luego screen-app.js -->
    <script type="module">
        import { animate, stagger, createSpring } from 'https://esm.sh/animejs';
        window.anime = { animate, stagger, createSpring };
        
        // Cargar screen-app.js después de que anime.js esté listo
        const script = document.createElement('script');
        script.src = 'screen-app.js';
        document.body.appendChild(script);
    </script>
</body>
</html>

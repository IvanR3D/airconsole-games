<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- AirConsole: viewport optimizado para controladores móviles -->
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>Laboratorio Químico - Control</title>
    
    <!-- AirConsole: Prevenir comportamientos táctiles no deseados -->
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        html, body {
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        /* AirConsole: Ocultar vistas por defecto para evitar flash */
        .view { display: none; }
        .view.active { display: flex; }
    </style>
    
    <!-- AirConsole API (versión 1.8.0 - última estable) -->
    <script src="https://www.airconsole.com/api/airconsole-1.8.0.js"></script>
    <!-- Iconify para iconos -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: { turquesa: '#0595AE', morado: '#AB3D8B', naranja: '#EB8225', verde: '#73A03F' },
                        lab: { primary: '#6366f1', secondary: '#8b5cf6', accent: '#06b6d4', success: '#10b981', warning: '#f59e0b', danger: '#ef4444' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="controller-styles.css">
</head>
<body class="font-sans overflow-hidden">
    <!-- AirConsole: Contenedor principal del controlador -->
    <div id="app" class="w-full h-screen"></div>
    
    <!-- Cargar anime.js y luego controller-app.js -->
    <script type="module">
        import { animate, stagger } from 'https://esm.sh/animejs';
        window.anime = { animate, stagger };
        
        // Cargar controller-app.js después de que anime.js esté listo
        const script = document.createElement('script');
        script.src = 'controller-app.js';
        document.body.appendChild(script);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINE RUN — AirConsole</title>
<style>
  :root{
    --bg:#f4f3ef;
    --ink:#1c1c1a;
    --muted:#6f6d66;
    --line:#d8d5cc;
    --panel:#ffffffcc;
    --accent:#c76b3f;
    --p1:#c76b3f; --p2:#3f7fc7; --p3:#4fa872; --p4:#b256c7;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
  }
  #gameCanvas{ position:fixed; inset:0; display:block; }

  .overlay{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(244,243,239,0.96);
    z-index:10; padding:20px;
  }
  .hidden{ display:none !important; }

  .title{ font-size:clamp(38px,7vw,68px); font-weight:700; letter-spacing:-1px; color:var(--ink); line-height:1; }
  .title span{ color:var(--accent); }
  .subtitle{ margin-top:12px; letter-spacing:3px; font-size:clamp(11px,2vw,13px); color:var(--muted); text-transform:uppercase; }

  .btn{
    margin-top:30px; padding:14px 42px; font-size:16px; font-weight:600;
    letter-spacing:0.5px; border:1px solid var(--ink); cursor:default;
    background:var(--ink); color:#fdfdfb; border-radius:3px;
  }

  /* ---------- lobby ---------- */
  #playerSlots{ display:flex; gap:18px; margin-top:44px; flex-wrap:wrap; justify-content:center; max-width:820px; }
  .slot{
    width:150px; padding:18px 10px; border-radius:10px; border:2px dashed var(--line);
    background:#fff; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .slot.filled{ border-style:solid; }
  .slot .avatar{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:#fff;
  }
  .slot .name{ font-size:13px; font-weight:600; }
  .slot .tag{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .lobby-hint{ margin-top:36px; font-size:13px; color:var(--muted); letter-spacing:0.3px; max-width:460px; }
  .lobby-hint b{ color:var(--ink); }
  #joinCode{ margin-top:18px; font-size:13px; color:var(--muted); }

  /* ---------- countdown ---------- */
  #countdownScreen .num{ font-size:clamp(90px,20vw,180px); font-weight:800; color:var(--accent); }

  /* ---------- gameplay HUD / split screen ---------- */
  #hudLayer{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .viewportDivider{ position:absolute; background:var(--ink); opacity:0.08; }
  .playerHud{ position:absolute; overflow:hidden; }
  .playerHud .badge{
    position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 12px;
    backdrop-filter:blur(4px);
  }
  .playerHud .dot{ width:10px; height:10px; border-radius:50%; }
  .playerHud .pname{ font-size:12px; font-weight:700; }
  .playerHud .stats{
    position:absolute; top:12px; right:12px; display:flex; gap:8px;
  }
  .stat-box{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 12px; text-align:center; backdrop-filter:blur(4px); }
  .stat-box .lbl{ font-size:8px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
  .stat-box .val{ font-size:15px; font-weight:700; }
  .elimBanner{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px; background:rgba(28,28,26,0.55); color:#fff; opacity:0; transition:opacity .25s ease;
  }
  .elimBanner.show{ opacity:1; }
  .elimBanner .big{ font-size:clamp(18px,3vw,26px); font-weight:800; letter-spacing:1px; }
  .elimBanner .small{ font-size:12px; opacity:0.85; }
  .emptySlotFill{ position:absolute; display:flex; align-items:center; justify-content:center; background:#eae8e2; color:var(--muted); font-size:13px; }

  /* ---------- scoreboard ---------- */
  #scoreboardScreen table{ margin-top:30px; border-collapse:collapse; min-width:420px; }
  #scoreboardScreen td, #scoreboardScreen th{ padding:10px 20px; text-align:left; font-size:14px; }
  #scoreboardScreen th{ color:var(--muted); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; border-bottom:1px solid var(--line); }
  #scoreboardScreen tr.me-row td{ font-weight:700; }
  #scoreboardScreen .rank1{ color:var(--accent); font-weight:800; }
  .rankdot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px; }

  #fadeFlash{ position:fixed; inset:0; background:#1c1c1a; opacity:0; pointer-events:none; z-index:20; transition:opacity .09s ease; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="fadeFlash"></div>
<div id="hudLayer"></div>

<!-- LOBBY -->
<div id="lobbyScreen" class="overlay">
  <div class="title">LINE<span>RUN</span></div>
  <div class="subtitle">AirConsole Edition · Hasta 4 jugadores</div>
  <div id="playerSlots"></div>
  <div class="lobby-hint" id="lobbyHint">
    Abre <b>airconsole.com</b> en tu teléfono y usa el código en pantalla para conectar tu mando.
  </div>
  <div id="joinCode"></div>
</div>

<!-- COUNTDOWN -->
<div id="countdownScreen" class="overlay hidden">
  <div class="subtitle">Prepárate</div>
  <div class="num" id="countdownNum">3</div>
</div>

<!-- SCOREBOARD -->
<div id="scoreboardScreen" class="overlay hidden">
  <div class="title" style="font-size:clamp(30px,6vw,50px);">RESULTADOS</div>
  <table id="scoreTable"></table>
  <div class="lobby-hint" id="restartHint">Esperando al anfitrión para jugar de nuevo…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.airconsole.com/api/airconsole-latest.js"></script>
<script src="audio.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const MAX_PLAYERS   = 4;
const PLAYER_COLORS = ["#c76b3f", "#3f7fc7", "#4fa872", "#b256c7"];

const LANE_WIDTH   = 2.4;
const LANE_X       = [-LANE_WIDTH, 0, LANE_WIDTH];
const GROUND_Y      = 0;
const GRAVITY        = -32;
const JUMP_VELOCITY  = 12.5;
const DUCK_DURATION  = 0.65;
const LANE_LERP      = 12;
const BASE_SPEED     = 11;
const MAX_SPEED       = 27;
const SPEED_RAMP      = 0.012;
const DIFFICULTY_DISTANCE = 1400;
const SEGMENT_LENGTH  = 12;
const SPAWN_AHEAD     = 90;
const REMOVE_BEHIND   = 12;
const COIN_VALUE      = 10;
const PLAYER_HALF_W   = 0.55;
const PLAYER_HEIGHT   = 1.8;
const PLAYER_DUCK_H   = 0.9;

function lerp(a, b, t){ return a + (b - a) * t; }

/* ============================================================
   SHARED THREE.JS RESOURCES (materials/geometries reused by
   every player instance so 4 simultaneous tracks stay cheap)
   ============================================================ */
const groundMat = new THREE.MeshStandardMaterial({ color:0xe4e1d6, roughness:0.95 });
const railMat   = new THREE.MeshStandardMaterial({ color:0x9c988c, roughness:0.6, metalness:0.15 });
const tieMat    = new THREE.MeshStandardMaterial({ color:0xb7b2a3, roughness:0.9 });
const wallMat   = new THREE.MeshStandardMaterial({ color:0xd7d3c6, roughness:0.9 });
const barrierMat= new THREE.MeshStandardMaterial({ color:0x2b2b28, roughness:0.85 });
const trainMat  = new THREE.MeshStandardMaterial({ color:0xc76b3f, roughness:0.85 });
const overheadMat = new THREE.MeshStandardMaterial({ color:0x2b2b28, roughness:0.85 });
const coinMat   = new THREE.MeshStandardMaterial({ color:0xc76b3f, roughness:0.5, metalness:0.2 });
const coinGeo   = new THREE.CylinderGeometry(0.28, 0.28, 0.08, 16);
const bodyMat   = new THREE.MeshStandardMaterial({ color:0x2b2b28, roughness:0.8 });
const skinMat   = new THREE.MeshStandardMaterial({ color:0xe7c9a3, roughness:0.9 });

function playerAccentMat(colorHex){
  return new THREE.MeshStandardMaterial({ color:colorHex, roughness:0.8 });
}

/* ============================================================
   RENDERER (single shared canvas, split via scissor test)
   ============================================================ */
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
const clock = new THREE.Clock();

function setShadowsEnabled(on){ renderer.shadowMap.enabled = on; }

/* ============================================================
   PER-PLAYER RUNNER INSTANCE
   ============================================================ */
class RunnerInstance{
  constructor(playerNumber, nickname, colorHex){
    this.playerNumber = playerNumber;
    this.nickname = nickname || ('Jugador ' + (playerNumber+1));
    this.colorHex = colorHex;
    this.accentMat = playerAccentMat(colorHex);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xf4f3ef);
    this.scene.fog = new THREE.Fog(0xf4f3ef, 22, 68);

    this.camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);
    this.camera.position.set(0, 5.4, 9.5);
    this.camera.lookAt(0, 1.4, -6);

    const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcabf, 0.95);
    this.scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.75);
    dir.position.set(-6, 14, 6);
    dir.castShadow = true;
    dir.shadow.mapSize.set(512,512);
    dir.shadow.camera.left = -12; dir.shadow.camera.right = 12;
    dir.shadow.camera.top = 12; dir.shadow.camera.bottom = -12;
    this.scene.add(dir);

    this.playerMixerParts = {};
    this.currentLane = 1;
    this.targetX = LANE_X[1];
    this.velocityY = 0;
    this.isJumping = false;
    this.isDucking = false;
    this.duckTimer = 0;
    this.gameSpeed = BASE_SPEED;
    this.distance = 0;
    this.coinsCollected = 0;
    this.score = 0;
    this.alive = true;
    this.segments = [];
    this.nextSpawnZ = -SEGMENT_LENGTH;
    this.playerBox = new THREE.Box3();
    this.tmpBox = new THREE.Box3();
    this.viewport = {x:0,y:0,w:1,h:1};

    this.buildPlayer();
  }

  buildPlayer(){
    const player = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.75, 0.38), bodyMat);
    torso.position.y = 1.0; torso.castShadow = true;
    player.add(torso);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), skinMat);
    head.position.y = 1.55; head.castShadow = true;
    player.add(head);

    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.22, 12), this.accentMat);
    cap.position.y = 1.74;
    player.add(cap);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.62, 0.26), this.accentMat);
    legL.position.set(-0.17, 0.35, 0); legL.castShadow = true;
    player.add(legL);
    const legR = legL.clone(); legR.position.x = 0.17;
    player.add(legR);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.55, 0.2), bodyMat);
    armL.position.set(-0.42, 1.0, 0); armL.castShadow = true;
    player.add(armL);
    const armR = armL.clone(); armR.position.x = 0.42;
    player.add(armR);

    player.position.set(LANE_X[1], GROUND_Y, 0);
    this.scene.add(player);
    this.player = player;
    this.playerMixerParts = { legL, legR, armL, armR };
  }

  resetPlayer(){
    this.currentLane = 1;
    this.targetX = LANE_X[1];
    this.player.position.set(this.targetX, GROUND_Y, 0);
    this.player.rotation.set(0,0,0);
    this.player.scale.set(1,1,1);
    this.velocityY = 0;
    this.isJumping = false;
    this.isDucking = false;
    this.duckTimer = 0;
  }

  makeGroundTile(z){
    const g = new THREE.Group();
    const floor = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH*3 + 2, 0.4, SEGMENT_LENGTH), groundMat);
    floor.position.set(0, -0.2, 0); floor.receiveShadow = true;
    g.add(floor);
    LANE_X.forEach(x=>{
      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, SEGMENT_LENGTH), railMat);
      railL.position.set(x-0.5, 0.04, 0);
      g.add(railL);
      const railR = railL.clone(); railR.position.x = x+0.5;
      g.add(railR);
    });
    for(let i=0;i<SEGMENT_LENGTH;i+=1.4){
      const tie = new THREE.Mesh(new THREE.BoxGeometry(LANE_WIDTH*3, 0.06, 0.3), tieMat);
      tie.position.set(0, 0.01, -SEGMENT_LENGTH/2 + i);
      g.add(tie);
    }
    [-1,1].forEach(side=>{
      const wall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.2, SEGMENT_LENGTH), wallMat);
      wall.position.set(side*(LANE_WIDTH*1.5+1.3), 1.4, 0);
      wall.receiveShadow = true;
      g.add(wall);
    });
    g.position.z = z;
    this.scene.add(g);
    return g;
  }

  makeBarrier(lane){
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 0.5), barrierMat);
    m.position.set(LANE_X[lane], 0.45, 0); m.castShadow = true;
    return m;
  }
  makeTrainWall(lane){
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.6, 2.4), trainMat);
    m.position.set(LANE_X[lane], 1.3, 0); m.castShadow = true;
    return m;
  }
  makeOverhead(lane){
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.6), overheadMat);
    m.position.set(LANE_X[lane], 1.65, 0); m.castShadow = true;
    return m;
  }
  makeCoin(lane, y){
    const m = new THREE.Mesh(coinGeo, coinMat);
    m.rotation.x = Math.PI/2;
    m.position.set(LANE_X[lane], y, 0);
    return m;
  }
  spawnCoinRow(group, lane, startLocalZ, count, y){
    const coins = [];
    for(let i=0;i<count;i++){
      const c = this.makeCoin(lane, y);
      c.position.z = startLocalZ - i*1.1;
      group.add(c);
      coins.push(c);
    }
    return coins;
  }

  generateSegment(){
    const worldZ = this.nextSpawnZ;
    const group = this.makeGroundTile(worldZ);
    const obstacles = [];
    let coins = [];
    const difficulty = Math.min(1, this.distance / DIFFICULTY_DISTANCE);

    const wEmpty   = lerp(0.16, 0.05, difficulty);
    const wBarrier = lerp(0.26, 0.16, difficulty);
    const wTrain   = lerp(0.24, 0.30, difficulty);
    const wOverhead= lerp(0.20, 0.22, difficulty);

    const roll = Math.random();
    let acc = 0;
    if(roll < (acc += wEmpty)){
      coins = coins.concat(this.spawnCoinRow(group, 1, 3, 6, 1.1));
    } else if(roll < (acc += wBarrier)){
      const lane = Math.floor(Math.random()*3);
      const ob = this.makeBarrier(lane); ob.position.z = 0;
      group.add(ob); obstacles.push(ob);
      const freeLane = (lane+1)%3;
      coins = coins.concat(this.spawnCoinRow(group, freeLane, 2, 5, 1.1));
    } else if(roll < (acc += wTrain)){
      const blockTwoChance = lerp(0.5, 0.8, difficulty);
      const blockedCount = Math.random() < blockTwoChance ? 2 : 1;
      const lanes = [0,1,2].sort(()=>Math.random()-0.5).slice(0, blockedCount);
      lanes.forEach(l=>{
        const ob = this.makeTrainWall(l); ob.position.z = 0;
        group.add(ob); obstacles.push(ob);
      });
      const openLane = [0,1,2].find(l=>!lanes.includes(l));
      coins = coins.concat(this.spawnCoinRow(group, openLane, 2.5, 5, 1.1));
    } else if(roll < (acc += wOverhead)){
      [0,1,2].forEach(l=>{
        const ob = this.makeOverhead(l); ob.position.z = 0;
        group.add(ob); obstacles.push(ob);
      });
      coins = coins.concat(this.spawnCoinRow(group, 1, 2.5, 4, 0.55));
    } else {
      const bLane = Math.floor(Math.random()*3);
      const barrier = this.makeBarrier(bLane); barrier.position.z = -2;
      group.add(barrier); obstacles.push(barrier);
      const oLanes = [0,1,2].filter(l=>l!==bLane);
      oLanes.forEach(l=>{
        const ob = this.makeOverhead(l); ob.position.z = 3;
        group.add(ob); obstacles.push(ob);
      });
      coins = coins.concat(this.spawnCoinRow(group, bLane, 3.5, 3, 1.1));
      if(difficulty > 0.5 && Math.random() < 0.35){
        const bLane2 = (bLane + 1 + Math.floor(Math.random()*2)) % 3;
        const barrier2 = this.makeBarrier(bLane2); barrier2.position.z = 5.5;
        group.add(barrier2); obstacles.push(barrier2);
      }
    }
    this.segments.push({ group, z: worldZ, obstacles, coins });
    this.nextSpawnZ -= SEGMENT_LENGTH;
  }

  maybeSpawn(){ while(this.nextSpawnZ > -SPAWN_AHEAD){ this.generateSegment(); } }

  recycleSegments(){
    for(let i=this.segments.length-1;i>=0;i--){
      const seg = this.segments[i];
      if(seg.group.position.z > REMOVE_BEHIND){
        this.scene.remove(seg.group);
        this.segments.splice(i,1);
      }
    }
  }

  clearWorld(){
    for(const seg of this.segments){ this.scene.remove(seg.group); }
    this.segments = [];
    this.nextSpawnZ = -SEGMENT_LENGTH;
  }

  start(){
    this.clearWorld();
    this.resetPlayer();
    this.gameSpeed = BASE_SPEED;
    this.distance = 0;
    this.coinsCollected = 0;
    this.score = 0;
    this.alive = true;
    for(let i=0;i<Math.ceil(SPAWN_AHEAD/SEGMENT_LENGTH);i++){ this.generateSegment(); }
  }

  changeLane(dir){
    if(!this.alive) return;
    const newLane = this.currentLane + dir;
    if(newLane < 0 || newLane > 2) return;
    this.currentLane = newLane;
    this.targetX = LANE_X[this.currentLane];
    GameAudio.playLaneChange();
  }
  doJump(){
    if(!this.alive || this.isJumping || this.isDucking) return;
    this.isJumping = true; this.velocityY = JUMP_VELOCITY;
    GameAudio.playJump();
  }
  doDuck(){
    if(!this.alive || this.isJumping) return;
    this.isDucking = true; this.duckTimer = DUCK_DURATION;
    GameAudio.playDuck();
  }

  updatePlayerBox(){
    const h = this.isDucking ? PLAYER_DUCK_H : PLAYER_HEIGHT;
    const yBase = this.isDucking ? 0.05 : 0.0;
    this.playerBox.min.set(this.player.position.x - PLAYER_HALF_W, this.player.position.y + yBase, this.player.position.z - 0.4);
    this.playerBox.max.set(this.player.position.x + PLAYER_HALF_W, this.player.position.y + yBase + h, this.player.position.z + 0.4);
  }

  checkCollisions(onCrash, onCoin){
    this.scene.updateMatrixWorld(true);
    this.updatePlayerBox();
    for(const seg of this.segments){
      for(let i=seg.obstacles.length-1;i>=0;i--){
        const ob = seg.obstacles[i];
        if(!ob.parent) continue;
        this.tmpBox.setFromObject(ob);
        if(this.playerBox.intersectsBox(this.tmpBox)){ onCrash(); return; }
      }
      for(let i=seg.coins.length-1;i>=0;i--){
        const coin = seg.coins[i];
        if(!coin.visible) continue;
        this.tmpBox.setFromObject(coin);
        if(this.playerBox.intersectsBox(this.tmpBox)){
          coin.visible = false;
          this.coinsCollected++;
          this.score += COIN_VALUE;
          onCoin();
          seg.coins.splice(i,1);
        }
      }
    }
  }

  update(dt, onCrash, onCoin){
    if(!this.alive) return;
    this.gameSpeed = Math.min(MAX_SPEED, BASE_SPEED + this.distance*SPEED_RAMP);

    // player movement
    this.player.position.x += (this.targetX - this.player.position.x) * Math.min(1, LANE_LERP*dt);
    this.player.rotation.z = (this.targetX - this.player.position.x) * -0.15;
    if(this.isJumping){
      this.velocityY += GRAVITY*dt;
      this.player.position.y += this.velocityY*dt;
      if(this.player.position.y <= GROUND_Y){
        this.player.position.y = GROUND_Y; this.isJumping = false; this.velocityY = 0;
      }
    }
    if(this.isDucking){
      this.duckTimer -= dt;
      this.player.scale.y = 0.55;
      this.player.position.y = GROUND_Y;
      if(this.duckTimer <= 0){ this.isDucking = false; this.player.scale.y = 1; }
    }
    const runT = clock.elapsedTime * 10;
    if(!this.isJumping){
      this.playerMixerParts.legL.rotation.x = Math.sin(runT)*0.6;
      this.playerMixerParts.legR.rotation.x = -Math.sin(runT)*0.6;
      this.playerMixerParts.armL.rotation.x = -Math.sin(runT)*0.5;
      this.playerMixerParts.armR.rotation.x = Math.sin(runT)*0.5;
    } else {
      this.playerMixerParts.legL.rotation.x = 0.4;
      this.playerMixerParts.legR.rotation.x = -0.3;
    }

    // world scroll
    const dz = this.gameSpeed*dt;
    this.distance += dz;
    for(const seg of this.segments){ seg.group.position.z += dz; }
    this.nextSpawnZ += dz;
    this.camera.position.x += (this.player.position.x*0.4 - this.camera.position.x)*Math.min(1,6*dt);
    this.camera.lookAt(this.player.position.x*0.4, 1.6, -6);

    this.maybeSpawn();
    this.recycleSegments();
    this.checkCollisions(onCrash, onCoin);
    this.score += dt*this.gameSpeed*0.6;
  }

  setViewportCSS(rect){ this.viewportCSS = rect; this.camera.aspect = rect.w / rect.h; this.camera.updateProjectionMatrix(); }
}

/* ============================================================
   LAYOUT
   ============================================================ */
function computeLayoutCSS(n, w, h){
  let cols = n<=1?1:2;
  let rows = n<=2?1:2;
  const cw = w/cols, ch = h/rows;
  const rects = [];
  for(let i=0;i<n;i++){
    const col = i%cols, row = Math.floor(i/cols);
    rects.push({x:col*cw, y:row*ch, w:cw, h:ch});
  }
  return { rects, cols, rows };
}

/* ============================================================
   AIRCONSOLE
   ============================================================ */
const airconsole = new AirConsole();

let state = 'lobby'; // lobby | countdown | playing | scoreboard
let instances = [];  // active RunnerInstance list, index = slot order
let countdownVal = 3;
let countdownTimer = null;
let endTimer = null;

function activeSlots(){
  const slots = [];
  for(let p=0;p<MAX_PLAYERS;p++){
    const deviceId = airconsole.convertPlayerNumberToDeviceId(p);
    if(deviceId !== undefined && airconsole.getControllerDeviceIds().indexOf(deviceId) !== -1){
      slots.push({ playerNumber:p, deviceId, nickname: airconsole.getNickname(deviceId) || ('Jugador '+(p+1)) });
    }
  }
  return slots;
}

function renderLobby(){
  const container = document.getElementById('playerSlots');
  container.innerHTML = '';
  const slots = activeSlots();
  const masterId = airconsole.getMasterControllerDeviceId();
  for(let p=0;p<MAX_PLAYERS;p++){
    const found = slots.find(s=>s.playerNumber===p);
    const div = document.createElement('div');
    div.className = 'slot' + (found ? ' filled' : '');
    if(found){
      const isHost = found.deviceId === masterId;
      div.innerHTML =
        '<div class="avatar" style="background:'+PLAYER_COLORS[p]+'">'+ (p+1) +'</div>'+
        '<div class="name">'+escapeHtml(found.nickname)+'</div>'+
        '<div class="tag">'+(isHost ? 'Anfitrión' : 'Listo')+'</div>';
    } else {
      div.innerHTML =
        '<div class="avatar" style="background:#dedad0;color:#8a877e">'+(p+1)+'</div>'+
        '<div class="name" style="color:var(--muted)">Vacío</div>'+
        '<div class="tag">Esperando…</div>';
    }
    container.appendChild(div);
  }
  const hint = document.getElementById('lobbyHint');
  if(slots.length === 0){
    hint.innerHTML = 'Abre <b>airconsole.com</b> en tu teléfono y usa el código en pantalla para conectar tu mando.';
  } else {
    hint.innerHTML = '<b>'+(slots.find(s=>s.deviceId===masterId)?.nickname || 'El anfitrión')+'</b> puede pulsar Empezar en su mando cuando todos estén listos.';
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showScreen(id){
  ['lobbyScreen','countdownScreen','scoreboardScreen'].forEach(sid=>{
    document.getElementById(sid).classList.toggle('hidden', sid !== id);
  });
}

function goLobby(){
  state = 'lobby';
  instances = [];
  document.getElementById('hudLayer').innerHTML = '';
  GameAudio.stopMusic();
  renderLobby();
  showScreen('lobbyScreen');
  airconsole.broadcast({ action:'state', state:'lobby' });
}

function startCountdown(){
  if(state !== 'lobby' && state !== 'scoreboard') return;
  const slots = activeSlots();
  if(slots.length === 0) return;
  state = 'countdown';
  showScreen('countdownScreen');
  countdownVal = 3;
  document.getElementById('countdownNum').textContent = countdownVal;
  GameAudio.playCountdownBeep(false);
  airconsole.broadcast({ action:'state', state:'countdown' });
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    countdownVal--;
    if(countdownVal > 0){
      document.getElementById('countdownNum').textContent = countdownVal;
      GameAudio.playCountdownBeep(false);
    } else {
      clearInterval(countdownTimer);
      document.getElementById('countdownNum').textContent = 'GO!';
      GameAudio.playCountdownBeep(true);
      setTimeout(beginGame, 350);
    }
  }, 800);
}

function buildHudDom(){
  const layer = document.getElementById('hudLayer');
  layer.innerHTML = '';
  instances.forEach((inst)=>{
    const hud = document.createElement('div');
    hud.className = 'playerHud';
    hud.id = 'hud-'+inst.playerNumber;
    hud.innerHTML =
      '<div class="badge"><div class="dot" style="background:'+inst.colorHex+'"></div><div class="pname">'+escapeHtml(inst.nickname)+'</div></div>'+
      '<div class="stats">'+
        '<div class="stat-box"><div class="lbl">Puntos</div><div class="val" data-role="score">0</div></div>'+
        '<div class="stat-box"><div class="lbl">Monedas</div><div class="val" data-role="coins">0</div></div>'+
        '<div class="stat-box"><div class="lbl">Nivel</div><div class="val" data-role="level">1</div></div>'+
      '</div>'+
      '<div class="elimBanner" data-role="elim"><div class="big">ELIMINADO</div><div class="small" data-role="elimScore"></div></div>';
    layer.appendChild(hud);
  });
  layoutViewports();
}

function layoutViewports(){
  const w = window.innerWidth, h = window.innerHeight;
  const { rects } = computeLayoutCSS(instances.length, w, h);
  instances.forEach((inst, i)=>{
    const r = rects[i];
    inst.setViewportCSS(r);
    const hud = document.getElementById('hud-'+inst.playerNumber);
    if(hud){
      hud.style.left = r.x+'px'; hud.style.top = r.y+'px';
      hud.style.width = r.w+'px'; hud.style.height = r.h+'px';
    }
  });
  renderer.setSize(w, h);
}

function beginGame(){
  const slots = activeSlots();
  setShadowsEnabled(slots.length <= 1);
  renderer.setPixelRatio(slots.length <= 1 ? Math.min(window.devicePixelRatio,2) : 1);
  instances = slots.map(s => new RunnerInstance(s.playerNumber, s.nickname, PLAYER_COLORS[s.playerNumber]));
  instances.forEach(inst => inst.start());
  buildHudDom();
  state = 'playing';
  showScreen(null);
  document.getElementById('lobbyScreen').classList.add('hidden');
  document.getElementById('countdownScreen').classList.add('hidden');
  document.getElementById('scoreboardScreen').classList.add('hidden');
  GameAudio.startMusic();
  airconsole.broadcast({ action:'state', state:'playing' });
}

function flashCrash(){
  const flash = document.getElementById('fadeFlash');
  flash.style.opacity = '0.55';
  setTimeout(()=>{ flash.style.opacity = '0'; }, 130);
}

function eliminatePlayer(inst){
  inst.alive = false;
  GameAudio.playCrash();
  flashCrash();
  const hud = document.getElementById('hud-'+inst.playerNumber);
  if(hud){
    const banner = hud.querySelector('[data-role="elim"]');
    hud.querySelector('[data-role="elimScore"]').textContent = 'Puntuación: '+Math.floor(inst.score);
    banner.classList.add('show');
  }
  airconsole.message(airconsole.convertPlayerNumberToDeviceId(inst.playerNumber), {
    action:'playerEliminated', score: Math.floor(inst.score), coins: inst.coinsCollected
  });
  if(instances.every(i => !i.alive)){
    clearTimeout(endTimer);
    endTimer = setTimeout(endGame, 1200);
  }
}

function endGame(){
  if(state !== 'playing') return;
  state = 'scoreboard';
  GameAudio.stopMusic();
  GameAudio.playFanfare();
  const results = instances.map(inst => ({
    playerNumber: inst.playerNumber,
    nickname: inst.nickname,
    score: Math.floor(inst.score),
    coins: inst.coinsCollected,
    colorHex: inst.colorHex
  })).sort((a,b)=> b.score - a.score);
  results.forEach((r,i)=> r.rank = i+1);

  const table = document.getElementById('scoreTable');
  table.innerHTML = '<tr><th></th><th>Jugador</th><th>Puntos</th><th>Monedas</th></tr>' +
    results.map(r=>
      '<tr'+(r.rank===1?' class="rank1"':'')+'>'+
      '<td><span class="rankdot" style="background:'+r.colorHex+'"></span>#'+r.rank+'</td>'+
      '<td>'+escapeHtml(r.nickname)+'</td>'+
      '<td>'+r.score+'</td>'+
      '<td>'+r.coins+'</td>'+
      '</tr>'
    ).join('');

  const masterId = airconsole.getMasterControllerDeviceId();
  const hostSlot = activeSlots().find(s=>s.deviceId===masterId);
  document.getElementById('restartHint').innerHTML = hostSlot
    ? '<b>'+escapeHtml(hostSlot.nickname)+'</b> puede pulsar Jugar de nuevo en su mando.'
    : 'Esperando a que el anfitrión juegue de nuevo…';

  showScreen('scoreboardScreen');
  airconsole.broadcast({ action:'scoreboard', results });
}

/* ============================================================
   AIRCONSOLE EVENTS
   ============================================================ */
airconsole.onReady = function(){
  airconsole.setActivePlayers(MAX_PLAYERS);
  renderLobby();
};

airconsole.onConnect = function(device_id){
  GameAudio.playJoin();
  airconsole.setActivePlayers(MAX_PLAYERS);
  if(state === 'lobby') renderLobby();
};

airconsole.onDisconnect = function(device_id){
  airconsole.setActivePlayers(MAX_PLAYERS);
  if(state === 'lobby') renderLobby();
};

airconsole.onActivePlayersChange = function(){
  if(state === 'lobby') renderLobby();
};

airconsole.onMessage = function(from, data){
  if(!data || !data.action) return;
  const playerNumber = airconsole.convertDeviceIdToPlayerNumber(from);

  if(data.action === 'start' && state === 'lobby' && from === airconsole.getMasterControllerDeviceId()){
    startCountdown();
    return;
  }
  if(data.action === 'restart' && state === 'scoreboard' && from === airconsole.getMasterControllerDeviceId()){
    startCountdown();
    return;
  }
  if(data.action === 'input' && state === 'playing' && playerNumber !== -1){
    const inst = instances.find(i=>i.playerNumber===playerNumber);
    if(!inst) return;
    if(data.type === 'lane') inst.changeLane(data.dir);
    else if(data.type === 'jump') inst.doJump();
    else if(data.type === 'duck') inst.doDuck();
  }
};

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', ()=>{ if(state === 'playing') layoutViewports(); });

/* ============================================================
   MAIN LOOP
   ============================================================ */
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(state === 'playing'){
    instances.forEach(inst=>{
      if(!inst.alive) return;
      inst.update(dt,
        ()=> eliminatePlayer(inst),
        ()=> GameAudio.playCoin()
      );
      const hud = document.getElementById('hud-'+inst.playerNumber);
      if(hud){
        hud.querySelector('[data-role="score"]').textContent = Math.floor(inst.score);
        hud.querySelector('[data-role="coins"]').textContent = inst.coinsCollected;
        const difficulty = Math.min(1, inst.distance / DIFFICULTY_DISTANCE);
        hud.querySelector('[data-role="level"]').textContent = 1 + Math.floor(difficulty*9);
      }
    });

    renderer.setScissorTest(true);
    const canvasW = renderer.domElement.width, canvasH = renderer.domElement.height;
    const dpr = renderer.getPixelRatio();
    instances.forEach(inst=>{
      const r = inst.viewportCSS;
      if(!r) return;
      const px = Math.round(r.x*dpr), pw = Math.round(r.w*dpr), ph = Math.round(r.h*dpr);
      const py = Math.round(canvasH - r.y*dpr - ph);
      renderer.setViewport(px, py, pw, ph);
      renderer.setScissor(px, py, pw, ph);
      renderer.render(inst.scene, inst.camera);
    });
    renderer.setScissorTest(false);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
window.addEventListener('resize', ()=>{ if(state !== 'playing') renderer.setSize(window.innerWidth, window.innerHeight); });
document.body.addEventListener('touchstart', ()=> GameAudio.unlock(), { once:true, passive:true });
document.body.addEventListener('click', ()=> GameAudio.unlock(), { once:true });
frame();

})();
</script>
